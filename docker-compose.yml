version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"

  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ecr,ecs,iam,logs,ec2
      - DEBUG=0
    volumes:
      - "localstack-data:/var/lib/localstack"

volumes:
  localstack-data:
