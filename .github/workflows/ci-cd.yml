name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write   # needed to push images to GitHub Container Registry
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------------------
  # 1. Test: unit tests + linting
  # -------------------------------------------------------------------------
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app

      - name: Run unit tests
        run: pytest app/tests -v --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # -------------------------------------------------------------------------
  # 2. Static analysis + dependency scanning
  # -------------------------------------------------------------------------
  security-scan:
    name: Static Analysis & Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Static analysis with bandit (code-level security issues)
        run: bandit -r app -x app/tests -f json -o bandit-report.json
        continue-on-error: true

      - name: Dependency vulnerability scan with pip-audit
        run: pip-audit -r app/requirements.txt -f json -o pip-audit-report.json
        continue-on-error: true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

  # -------------------------------------------------------------------------
  # 3. Build & push Docker image (GitHub Container Registry — free for
  #    public repos, no cloud account needed)
  # -------------------------------------------------------------------------
  build-image:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 4. Validate infrastructure code (format + plan against LocalStack —
  #    a free, local AWS emulator, so this costs nothing to run)
  # -------------------------------------------------------------------------
  terraform-validate:
    name: Terraform Format, Validate & Plan
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: terraform
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: s3,ecr,ecs,iam,logs,ec2
          AWS_DEFAULT_REGION: us-east-1
          DEBUG: "1"
        options: >-
          --health-cmd="curl --fail --silent http://localhost:4566/_localstack/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=18
    steps:
      - uses: actions/checkout@v4

      - name: Install readiness dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      - name: Wait for LocalStack
        shell: bash
        run: |
          set -Eeuo pipefail

          health_url="http://127.0.0.1:4566/_localstack/health"
          required_services=(s3 ecr ecs iam logs ec2)

          for i in $(seq 1 60); do
            if health="$(curl --silent --show-error --fail "$health_url")"; then
              echo "$health" | jq .

              ready=true
              for service in "${required_services[@]}"; do
                status="$(jq -r --arg service "$service" \
                  '.services[$service] // "missing"' <<<"$health")"

                echo "$service: $status"

                case "$status" in
                  available|running)
                    ;;
                  *)
                    ready=false
                    ;;
                esac
              done

              if [[ "$ready" == true ]]; then
                echo "LocalStack is ready"
                exit 0
              fi
            else
              echo "LocalStack health endpoint is not responding yet"
            fi

            echo "Waiting for LocalStack ($i/60)..."
            sleep 2
          done

          echo "LocalStack did not become ready"
          docker logs "${{ job.services.localstack.id }}" || true
          exit 1

      - name: Terraform plan (against LocalStack, zero AWS cost)
        run: terraform plan -input=false -no-color -var="use_localstack=true"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"

  # -------------------------------------------------------------------------
  # 5. Deploy: apply infra + roll out the new image, then validate & roll
  #    back automatically on failure. Runs only on main, and only if every
  #    prior stage passed.
  # -------------------------------------------------------------------------
  deploy:
    name: Deploy & Validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build-image, terraform-validate]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform init
        working-directory: terraform
        run: terraform init

      - name: Terraform apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve -input=false \
            -var="use_localstack=false" \
            -var="container_image=${{ needs.build-image.outputs.image_tag }}"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          AWS_EC2_METADATA_DISABLED: "true"

      - name: Validate deployment health
        id: validate
        run: |
          chmod +x scripts/validate_deployment.sh
          ./scripts/validate_deployment.sh "${{ secrets.APP_BASE_URL }}" 10 5

      - name: Roll back on failed validation
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          chmod +x scripts/rollback.sh
          ./scripts/rollback.sh "$(terraform -chdir=terraform output -raw ecs_cluster_name)" \
                                 "$(terraform -chdir=terraform output -raw ecs_service_name)"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
